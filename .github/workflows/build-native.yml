name: Build native apps

# Run by hand to get build artifacts, or push a tag like v0.1.0 to build everything
# and publish a GitHub release (files, checksums and notes from CHANGELOG.md).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  plan:
    # A release published by hand (scripts/release.mjs --publish) already has its tag, so skip the rebuild.
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ] && gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: plan
    if: needs.plan.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools, platforms;android-35, build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: npm ci
      - run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: comik-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  linux:
    needs: plan
    if: needs.plan.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:linux
      - uses: actions/upload-artifact@v4
        with:
          name: comik-linux
          path: release/*.AppImage

  windows:
    # The portable build is cross-packaged on Linux, so no Windows runner or Wine is needed.
    needs: plan
    if: needs.plan.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:windows:portable
      - uses: actions/upload-artifact@v4
        with:
          name: comik-windows
          path: release/*-win-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Place build outputs where scripts/release.mjs expects them
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p android/app/build/outputs/apk/debug release
          cp artifacts/comik-android/app-debug.apk android/app/build/outputs/apk/debug/
          cp artifacts/comik-linux/*.AppImage "release/Comik-${version}.AppImage"
          cp artifacts/comik-windows/*-win-x64.zip "release/Comik-${version}-win-x64.zip"
      - run: node scripts/release.mjs --publish
        env:
          GH_TOKEN: ${{ github.token }}
