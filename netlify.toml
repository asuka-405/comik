[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The hosted site never fetches comic sources itself: doing so from one shared IP address would
# get that address banned. Browsers read comics through a proxy in the user's own Firebase project.
[[redirects]]
  from = "/web/*"
  to = "/web/index.html"
  status = 200

[[headers]]
  for = "/assets/webtoon-covers/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
