[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/web/*"
  to = "/web/index.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/comik-api/:splat"
  status = 200
  force = true